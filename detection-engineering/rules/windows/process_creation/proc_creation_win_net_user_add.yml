title: Local User Account Created via net.exe
id: 7ebbcc66-4b42-4e35-ae68-6b4a51b39ca2
status: experimental
description: >
    Detects net.exe or net1.exe creating a local account with /add, a common persistence step.
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1136.001/T1136.001.md
author: detection-engineering
date: 2026-11-12
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_cmd:
        CommandLine|contains|all:
            - ' user '
            - ' /add'
    condition: all of selection_*
falsepositives:
    - Helpdesk or provisioning scripts creating local accounts
level: medium
