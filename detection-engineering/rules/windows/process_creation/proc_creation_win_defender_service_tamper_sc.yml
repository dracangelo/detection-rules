title: Microsoft Defender Service Stopped or Disabled via sc.exe
id: 90ab27bb-0c5e-4631-a15d-6bc9da7eb54c
status: experimental
description: >
    Detects sc.exe stopping, deleting or disabling the WinDefend service. Logged even when
    Tamper Protection blocks the change, so it catches the attempt. (ATT&CK: Disable or Modify Tools, formerly T1562.001.)
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1685/T1685.md
author: detection-engineering
date: 2026-11-12
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\sc.exe'
        - OriginalFileName: 'sc.exe'
    selection_cmd_stop:
        CommandLine|contains|all:
            - ' stop '
            - 'windefend'
    selection_cmd_delete:
        CommandLine|contains|all:
            - ' delete '
            - 'windefend'
    selection_cmd_disable:
        CommandLine|contains|all:
            - ' config '
            - 'windefend'
            - 'disabled'
    condition: selection_img and 1 of selection_cmd_*
falsepositives:
    - Deliberate replacement of Defender when deploying a third-party AV (should be change-ticketed)
level: high
